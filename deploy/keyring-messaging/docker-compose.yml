# Keyring push wake-up gateway (OpenVTC/vti-push-gateway) and the DIDComm v2
# mediator it receives wake-ups through (Affinidi's messaging mediator, the one
# the VTI stack runs), behind Caddy with automatic HTTPS. See HANDOVER.md.
#
#   cp .env.example .env   # then fill it in
#   docker compose config  # static check
#   docker compose up -d
#
# Keyring's mailbox (the Credo mediator the app's MEDIATOR_URL points at) is not
# part of this stack and is not changed by it: phones never talk to this
# mediator. Only Caddy publishes ports. The gateway's metrics stay on its own
# loopback; the mediator's login endpoint is reachable only from inside this
# stack's network (Caddyfile), so the gateway is the only party that can hold a
# session on it.

name: keyring-messaging

x-no-auto-update: &no-auto-update
  # Every image here is pinned; updates are deliberate (README "Updating").
  com.centurylinklabs.watchtower.enable: "false"

services:
  gateway:
    # OpenVTC/vti-push-gateway has no published image; built from source at a
    # pinned commit (gateway/Dockerfile), or loaded from the CI artifact
    # (README "Getting the image").
    build:
      context: ./gateway
      args:
        GATEWAY_COMMIT: ${GATEWAY_COMMIT:-e542a9d77a7369f4f3da01d573107ea155c80691}
    # The tag is GATEWAY_IMAGE_TAG: the commit plus the patch set (`-pN`), so an
    # image with a new patch never shares a tag with the one before it. An
    # .env without it falls back to the bare commit, the tag used before
    # patch 0002 (README "Updating").
    image: keyring-messaging/vti-push-gateway:${GATEWAY_IMAGE_TAG:-${GATEWAY_COMMIT:-e542a9d77a7369f4f3da01d573107ea155c80691}}
    restart: unless-stopped
    environment:
      # Empty values are unset by the image's entrypoint, so every optional
      # variable below can stay blank in .env without breaking startup.
      GATEWAY_BIND: 0.0.0.0:8300
      # Advertised in wake handles only when there is no identity file; with
      # one, handles name the gateway's DID.
      GATEWAY_ADDR: ${SITE_SCHEME:-https}://${GATEWAY_HOST:?set GATEWAY_HOST in .env}
      GATEWAY_IDENTITY_FILE: ${GATEWAY_IDENTITY_FILE:-}
      # The controller VTAs (agents) this gateway serves, as exact DIDs. Unset
      # serves nothing: every push/register is refused.
      GATEWAY_ALLOWED_CONTROLLERS: ${GATEWAY_ALLOWED_CONTROLLERS:-}
      GATEWAY_ALLOWED_CONTROLLER_HOSTS: ${GATEWAY_ALLOWED_CONTROLLER_HOSTS:-}
      GATEWAY_APNS_KEY_FILE: ${GATEWAY_APNS_KEY_FILE:-}
      GATEWAY_APNS_KEY_ID: ${GATEWAY_APNS_KEY_ID:-}
      GATEWAY_APNS_TEAM_ID: ${GATEWAY_APNS_TEAM_ID:-}
      GATEWAY_APNS_TOPICS: ${GATEWAY_APNS_TOPICS:-}
      GATEWAY_FCM_SERVICE_ACCOUNT_FILE: ${GATEWAY_FCM_SERVICE_ACCOUNT_FILE:-}
      # Visible alert mode (gateway/patches/0001); blank = every wake silent.
      GATEWAY_ALERT_LOC_KEY: ${GATEWAY_ALERT_LOC_KEY:-}
      GATEWAY_ALERT_TITLE_LOC_KEY: ${GATEWAY_ALERT_TITLE_LOC_KEY:-}
      GATEWAY_ALERT_COLLAPSE_ID: ${GATEWAY_ALERT_COLLAPSE_ID:-}
      GATEWAY_FCM_ANDROID_CHANNEL_ID: ${GATEWAY_FCM_ANDROID_CHANNEL_ID:-}
      GATEWAY_STORE_FILE: /data/gateway-store.json
      GATEWAY_STRICT_KEY_PERMS: ${GATEWAY_STRICT_KEY_PERMS:-1}
      GATEWAY_DEV_ECHO_SENDER: ${GATEWAY_DEV_ECHO_SENDER:-}
      # Metrics stay on the container's loopback (the gateway's own default).
      GATEWAY_METRICS_BIND: 127.0.0.1:9300
      # Behind Caddy every HTTP client shares Caddy's address, so the gateway's
      # per-peer-IP limit is effectively a global one. Sized in .env.
      GATEWAY_HTTP_PER_SEC: ${GATEWAY_HTTP_PER_SEC:-}
      GATEWAY_HTTP_BURST: ${GATEWAY_HTTP_BURST:-}
      RUST_LOG: ${GATEWAY_LOG:-vti_push_gateway=info,tower_http=info}
    volumes:
      - ./data/gateway:/data
      - ./secrets:/run/secrets/gateway:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8300/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [edge]
    labels: *no-auto-update

  mediator:
    # Affinidi messaging mediator v0.33.1, built from source at a pinned commit
    # (mediator/Dockerfile); upstream's newest published image is far older.
    build:
      context: ./mediator
      args:
        MEDIATOR_COMMIT: ${MEDIATOR_COMMIT:-555806151b30a4ba2085a29384c8e048307e0083}
    image: keyring-messaging/messaging-mediator:${MEDIATOR_COMMIT:-555806151b30a4ba2085a29384c8e048307e0083}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["-c", "/etc/keyring-mediator/mediator.toml"]
    environment:
      # Its own identity, from mediator/setup-identity.sh.
      MEDIATOR_DID: did://${MEDIATOR_DID:-}
      ADMIN_DID: did://${MEDIATOR_ADMIN_DID:-}
      DATABASE_URL: redis://redis:6379/
      # Its public URL, so forwards addressed to itself are delivered locally.
      LOCAL_ENDPOINTS: https://${MEDIATOR_HOST:?set MEDIATOR_HOST in .env}
    volumes:
      - ./mediator/mediator.toml:/etc/keyring-mediator/mediator.toml:ro
      - ./secrets/mediator:/run/secrets/mediator:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7037/mediator/v1/livez"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [edge, store]
    labels: *no-auto-update

  redis:
    # The mediator's message store. Reachable only by the mediator.
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [store]
    labels: *no-auto-update

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      GATEWAY_HOST: ${GATEWAY_HOST}
      MEDIATOR_HOST: ${MEDIATOR_HOST}
      # https (default) = automatic certificates. http = plain HTTP, for a local
      # run or behind a tunnel that terminates TLS itself (README "Local testing").
      SITE_SCHEME: ${SITE_SCHEME:-https}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      edge:
        # Inside this network the mediator's public hostname resolves to Caddy
        # itself, so the gateway reaches the mediator's login endpoint from a
        # private address (the only place the Caddyfile allows it).
        aliases:
          - ${MEDIATOR_HOST}
    labels: *no-auto-update

networks:
  edge: {}
  # Redis only; no route to anything else.
  store:
    internal: true
