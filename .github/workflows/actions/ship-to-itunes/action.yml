name: Ship to TestFlight
description: Upload a signed .ipa to App Store Connect and distribute it to TestFlight groups

inputs:
  app_store_connect_key_id:
    description: The App Store Connect API key ID
    required: true
  app_store_connect_issuer_id:
    description: |
      The issuer ID of a team API key. Leave empty for an individual API key,
      which has no issuer.
    required: false
    default: ''
  app_store_connect_private_key:
    description: The API key's .p8 contents (PEM text)
    required: true
  ipa_path:
    description: Path to the signed .ipa
    required: true
  bundle_id:
    description: The app's bundle identifier
    required: true
  version_code:
    description: The build number (CFBundleVersion), i.e. 201
    required: true
  version_name:
    description: The marketing version (CFBundleShortVersionString), i.e. 0.2.0
    required: true
  beta_groups:
    description: Comma-separated TestFlight group names
    required: true
  release_notes:
    description: TestFlight "What to Test" text. Defaults to a version-based line.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Upload to App Store Connect
      shell: bash
      env:
        KEY_ID: ${{ inputs.app_store_connect_key_id }}
        ISSUER_ID: ${{ inputs.app_store_connect_issuer_id }}
        PRIVATE_KEY: ${{ inputs.app_store_connect_private_key }}
        IPA_PATH: ${{ inputs.ipa_path }}
      run: |
        set -euo pipefail
        export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
        mkdir -p "$API_PRIVATE_KEYS_DIR"

        # altool finds the key by file name: AuthKey_<id>.p8 for a team key,
        # ApiKey_<id>.p8 for an individual key. An individual key has no issuer;
        # altool still insists on the flag, and ignores its value.
        if [ -n "$ISSUER_ID" ]; then
          printf '%s\n' "$PRIVATE_KEY" > "$API_PRIVATE_KEYS_DIR/AuthKey_${KEY_ID}.p8"
          auth=(--api-key "$KEY_ID" --api-issuer "$ISSUER_ID")
        else
          printf '%s\n' "$PRIVATE_KEY" > "$API_PRIVATE_KEYS_DIR/ApiKey_${KEY_ID}.p8"
          auth=(--api-key "$KEY_ID" --api-issuer individual --api-key-subject user)
        fi

        # altool can exit 0 after "Failed to upload package" (seen on 502s from
        # Apple's upload service), so judge by its output, and retry: the upload
        # service fails intermittently while the rest of the API is healthy.
        for attempt in 1 2 3 4; do
          log="$RUNNER_TEMP/altool-$attempt.log"
          status=0
          xcrun altool --upload-app -f "$IPA_PATH" -t ios "${auth[@]}" --output-format normal 2>&1 | tee "$log" || status=$?
          if [ "$status" -eq 0 ] && ! grep -qE "Failed to upload|UPLOAD FAILED" "$log"; then
            echo "Upload succeeded on attempt $attempt"
            exit 0
          fi
          echo "::warning::altool upload attempt $attempt failed (exit $status)"
          [ "$attempt" -lt 4 ] && sleep $((attempt * 120))
        done
        echo "::error::Upload to App Store Connect failed after 4 attempts"
        exit 1

    - name: Distribute in TestFlight
      shell: bash
      env:
        ASC_KEY_ID: ${{ inputs.app_store_connect_key_id }}
        ASC_ISSUER_ID: ${{ inputs.app_store_connect_issuer_id }}
        BUNDLE_ID: ${{ inputs.bundle_id }}
        APP_VERSION: ${{ inputs.version_name }}
        BUILD_NUMBER: ${{ inputs.version_code }}
        BETA_GROUPS: ${{ inputs.beta_groups }}
        WHATS_NEW: ${{ inputs.release_notes || format('Release {0} ({1})', inputs.version_name, inputs.version_code) }}
      run: |
        set -euo pipefail
        prefix=$([ -n "$ASC_ISSUER_ID" ] && echo AuthKey || echo ApiKey)
        ASC_KEY_PATH="$RUNNER_TEMP/private_keys/${prefix}_${ASC_KEY_ID}.p8" \
          node scripts/testflight/distribute.mjs
