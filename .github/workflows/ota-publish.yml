name: OTA release

# Each run names its release and what it does: "OTA 276.2 · publish to ring 0", "OTA 276.2 · widen to everyone", ...
# A run-name becomes each run's API `.name` (the workflow keeps `name:` above). GitHub's workflow_run subscriptions
# match on a workflow's name, so post-release.yml lists "OTA release". At the first titled release, check that a
# "Post-release · OTA <n> ..." run started. If none did, workflow_run matched the run's title instead: drop run-name.
run-name: >-
  OTA ${{ inputs.release || inputs.channel }} ·
  ${{ inputs.action == 'publish' && (inputs.to_ring == 'ring2' && 'publish to everyone' || format('publish to {0}', inputs.to_ring == 'ring1' && 'ring 1' || 'ring 0'))
  || inputs.action == 'promote' && (inputs.to_ring == 'ring2' && 'widen to everyone' || 'widen to ring 1')
  || inputs.action == 'disable' && format('withdraw {0}', inputs.platform == 'both' && 'ios + android' || inputs.platform)
  || inputs.action }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Publishes an over-the-air JS bundle to ring 0 (the maintainers' own devices),
# phase 1 of docs/plans/release-cadence-and-testing-strategy/ota_updates_subtask.md.
# Run by hand from the Actions tab, on main, or on the release/* or hotfix/*
# branch of the store build it targets (a hot fix for build N descends from
# that build's own commit, not from main). A real publish first waits for a
# required reviewer on the "ota-approval" environment, which holds no secrets;
# only then does the "ota" environment hand over the signing key.
#
# Channels (the "channel" input). production is what store builds carry.
# preview is for an early-access group, and is signed with the same store key,
# because store builds carry only that public key. device-test is the
# quick-install test app's own channel, signed ONLY with its throwaway key
# (OTA_TEST_SIGNING_KEY_PEM), never the store key. scripts/ota/signing-key.mjs
# enforces that mapping and checks each key against OTA_PUBLIC_KEY. Every
# channel waits for the ota-approval reviewer. Only device-test takes a base
# commit instead of a build, skips the tier check, and has the trial's other
# actions (scripts/ota/device-test.sh). production and preview also take
# disable, which withdraws one bundle (scripts/ota/withdraw.mjs), and promote,
# which widens one bundle past ring 0 (scripts/ota/promote.mjs), one approval
# per promotion, after the soak in vars.OTA_PROMOTE_SOAK_HOURS (24 when unset). A
# publish itself reaches ring 0 only.
#
# A dry run checks the commit, the inputs and the signing-key mapping, and
# probes the server and token, without uploading.
# Not usable until both of these exist: the hosted update server (OTA_SERVER_URL)
# and store builds that carry the public key, the channel and the native
# fingerprint (a change to staging.yaml, in its own PR). Until then the spike
# publishes from a laptop with a throwaway key (deploy/keyring-ota/README.md).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'production (store builds), preview (early access, store key) or device-test (the quick-install test app, its own key)'
        type: choice
        options: [production, preview, device-test]
        default: production
      # Was `build` (the store build number). The release number carries it: the part before the dot. The dispatch
      # is at GitHub's ten-input limit, so the release could not be an input of its own.
      release:
        description: 'production/preview: the release, <store build>.<n>, e.g. 276.2 (the bundle targets store build 276, its staging-v*-276 tag); promote and disable take it as their label'
        type: string
        default: ''
      base:
        description: "device-test only: the test app's own build commit (full 40-character SHA)"
        type: string
        default: ''
      action:
        description: 'publish, disable or promote (both need bundle_id) for production/preview; device-test also: tamper, crash, mismatch, cleanup'
        type: choice
        options: [publish, promote, tamper, crash, mismatch, disable, cleanup]
        default: publish
      bundle_id:
        description: 'disable and promote only: the bundle to withdraw or widen; promote with platform both: ios:<id>,android:<id>'
        type: string
        default: ''
      to_ring:
        description: 'publish and promote: the widest ring the bundle reaches (ring2 = every install; ring1; or ring0, publish only, for a deliberate staged release). A publish to ring1 or ring2 widens in the same run, on its one approval'
        type: choice
        options: [ring2, ring1, ring0]
        default: ring2
      expect_fingerprint:
        description: "device-test publishes: the test app's native fingerprint for the platform (its build copy's app/fingerprint.json)"
        type: string
        default: ''
      platform:
        description: Which platform's bundle to publish
        type: choice
        options: [both, ios, android]
        default: both
      scope:
        description: 'fix, or within-purpose (a small addition inside an existing flow)'
        type: choice
        options: [fix, within-purpose]
        default: fix
      dry_run:
        description: 'Only run the checks (including the server and token probe); publish nothing'
        type: boolean
        default: true

permissions:
  contents: read
  # Reading the target store build's recorded fingerprint (an artifact of its staging run).
  actions: read

concurrency:
  group: ota-publish
  cancel-in-progress: false

jobs:
  approve:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-22.04
    environment: ota-approval
    steps:
      - run: echo "Approved - ${{ inputs.action }} to ${{ inputs.to_ring }} on channel ${{ inputs.channel }} from ${{ github.sha }} (release '${{ inputs.release }}', base '${{ inputs.base }}', bundle '${{ inputs.bundle_id }}', ${{ inputs.platform }}, scope ${{ inputs.scope }}), ${{ inputs.action == 'promote' && format('widening to {0}', inputs.to_ring) || 'ring 0' }}."

  publish:
    needs: [approve]
    # Runs after an approval, or straight away for a dry run (approve is skipped).
    if: ${{ !cancelled() && (needs.approve.result == 'success' || inputs.dry_run) }}
    # One job per platform, on the runner its store build uses (staging.yaml):
    # the native fingerprint depends on the host and on pod install, so a bundle
    # is built where its store build was, or it is offered to no phone.
    strategy:
      fail-fast: false
      matrix:
        # A promote of both platforms is one job, so its checks are all-or-nothing
        # (scripts/ota/promote.mjs --bundles); it needs no macOS runner.
        platform: ${{ fromJSON(inputs.platform == 'both' && (inputs.action == 'promote' && '["both"]' || '["ios","android"]') || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-22.04' }}
    environment: ota
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # main's ruleset requires signed commits and green checks; release/* and
      # hotfix/* have no rule, so the commit must be signed and verified by
      # GitHub whatever the branch, and the approver sees which commit it is.
      # The script then checks that it descends from the build's own tag.
      - name: Publish only a verified commit of main, release/* or hotfix/*
        env:
          REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$REF" in
            main|release/*|hotfix/*) ;;
            *) echo "::error::$REF: an OTA bundle is published only from main, release/* or hotfix/*"; exit 1 ;;
          esac
          verified=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.verification.verified)
          if [ "$verified" != "true" ]; then
            echo "::error::$GITHUB_SHA is not a signed commit that GitHub verified"
            exit 1
          fi
          echo "publishing $GITHUB_SHA from $REF (signature verified)"

      - name: The inputs fit the channel
        env:
          CHANNEL: ${{ inputs.channel }}
          ACTION: ${{ inputs.action }}
          RELEASE: ${{ inputs.release }}
          TO_RING: ${{ inputs.to_ring }}
          BASE: ${{ inputs.base }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          EXPECT_FINGERPRINT: ${{ inputs.expect_fingerprint }}
          PLATFORM: ${{ inputs.platform }}
          STORE_CHANNEL: ${{ vars.OTA_CHANNEL }}
        run: |
          err() { echo "::error::$1"; exit 1; }
          case "$CHANNEL" in
            production | preview)
              [ -z "$BASE" ] || err "base is for device-test only"
              # Every production/preview run names its release, so every run's title does: <store build>.<n>.
              [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+$ ]] || err "$CHANNEL needs release: <store build>.<n>, e.g. 276.2 (got '$RELEASE'); a bare store build number no longer names a release"
              case "$ACTION" in
                publish)
                  [ -z "$BUNDLE_ID" ] || err "bundle_id is for disable only" ;;
                # Withdrawing only narrows: scripts/ota/withdraw.mjs checks the bundle
                # is this channel's and this platform's, then disables it.
                # Withdrawing only narrows; promoting widens one bundle past ring 0
                # (scripts/ota/promote.mjs), the one way anything does.
                disable | promote)
                  [ -n "$BUNDLE_ID" ] || err "$ACTION needs bundle_id"
                  [ "$ACTION" != promote ] || [ "$TO_RING" != ring0 ] || err "promote widens past ring 0: to_ring ring0 is for a publish that stops there"
                  if [ "$PLATFORM" = both ]; then
                    # Each platform keeps its own bundle id: ios:<id>,android:<id>.
                    [ "$ACTION" = promote ] || err "disable takes one bundle: its own platform (ios or android), not both"
                    [[ "$BUNDLE_ID" =~ ^(ios|android):[0-9a-f-]+,(ios|android):[0-9a-f-]+$ ]] \
                      || err "promote with platform both takes bundle_id ios:<id>,android:<id> (got '$BUNDLE_ID')"
                  else
                    [[ "$BUNDLE_ID" != *:* ]] || err "a single-platform $ACTION takes a plain bundle id (got '$BUNDLE_ID')"
                  fi ;;
                *) err "$CHANNEL takes only the publish, disable and promote actions (got $ACTION)" ;;
              esac
              # staging.yaml writes vars.OTA_CHANNEL (default production) into store builds.
              if [ "$CHANNEL" = production ] && [ -n "$STORE_CHANNEL" ] && [ "$STORE_CHANNEL" != production ]; then
                err "store builds carry channel '$STORE_CHANNEL' (vars.OTA_CHANNEL), not production"
              fi ;;
            device-test)
              [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || err "device-test needs base: the test app's build commit as a full SHA (got '$BASE')"
              git merge-base --is-ancestor "$BASE" "$GITHUB_SHA" || err "base $BASE is not an ancestor of $GITHUB_SHA"
              [ -z "$RELEASE" ] || err "device-test takes base, not release"
              [ "$ACTION" != promote ] || err "promote is for production and preview; device-test bundles are never widened"
              if [ "$ACTION" = disable ]; then
                [ -n "$BUNDLE_ID" ] || err "disable needs bundle_id"
              else
                [ -z "$BUNDLE_ID" ] || err "bundle_id is for disable only"
              fi
              case "$ACTION" in
                disable | cleanup) ;;
                *) [[ "$EXPECT_FINGERPRINT" =~ ^[0-9a-f]{40}$ ]] || err "device-test $ACTION needs expect_fingerprint: the test app's fingerprint (got '$EXPECT_FINGERPRINT')" ;;
              esac
              echo "::warning::device-test: the tier check is skipped for this channel (the quick-install test app, base ${BASE:0:8}); nothing published here can reach a store build" ;;
            *) err "unknown channel $CHANNEL" ;;
          esac
          echo "channel $CHANNEL, action $ACTION${RELEASE:+, release $RELEASE}"

      # Runs on a dry run too, and before the slow install: a dry run then proves
      # the server and the token, not only the build. Nothing is uploaded: one
      # read-only management call (the list of channels), once without the token
      # (the server must refuse it, so it is ours and auth is on) and once with
      # it (it must be accepted). The token reaches curl as a config on stdin,
      # never on its command line.
      - name: Probe the update server and token (no upload)
        env:
          OTA_SERVER_URL: ${{ vars.OTA_SERVER_URL }}
          HOT_UPDATER_AUTH_TOKEN: ${{ secrets.HOT_UPDATER_AUTH_TOKEN }}
        run: |
          case "$OTA_SERVER_URL" in
            https://*) ;;
            "") echo "::error::the repository variable OTA_SERVER_URL is not set"; exit 1 ;;
            *) echo "::error::OTA_SERVER_URL must be https:// (got $OTA_SERVER_URL)"; exit 1 ;;
          esac
          if [ -z "$HOT_UPDATER_AUTH_TOKEN" ]; then
            echo "::error::the ota environment has no HOT_UPDATER_AUTH_TOKEN secret (set it from Secret Manager's kota-auth-token)"
            exit 1
          fi
          probe="${OTA_SERVER_URL%/}/hot-updater/api/bundles/channels"
          anon=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$probe" || true)
          if [ "$anon" != "401" ]; then
            echo "::error::$probe answered $anon without a token; expected 401 (wrong URL, server down, or auth off)"
            exit 1
          fi
          auth=$(printf 'header = "Authorization: Bearer %s"\n' "$HOT_UPDATER_AUTH_TOKEN" \
            | curl -sS -K - -o /dev/null -w '%{http_code}' --max-time 20 "$probe" || true)
          if [ "$auth" != "200" ]; then
            echo "::error::$probe answered $auth with the token; expected 200 (the secret does not match kota-auth-token?)"
            exit 1
          fi
          echo "update server reachable at $OTA_SERVER_URL; token accepted (401 without, 200 with)"

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Build bifold packages
        working-directory: bifold
        run: |
          yarn install --immutable
          yarn build

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify bifold linking
        run: node scripts/verify-bifold-linking.js

      # iOS: the store build's own steps before its fingerprint (staging.yaml,
      # build-ios-staging). pod install rewrites a podspec inside node_modules
      # (react-native-permissions' setup_permissions), and the fingerprint
      # hashes it, so a bundle built without these steps matches no store build.
      - name: Configure ruby (iOS)
        if: ${{ matrix.platform == 'ios' && !contains(fromJSON('["disable","cleanup","promote"]'), inputs.action) }}
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./app

      - name: Select Xcode 26.3 (iOS)
        if: ${{ matrix.platform == 'ios' && !contains(fromJSON('["disable","cleanup","promote"]'), inputs.action) }}
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app

      - name: Install iOS dependencies (iOS)
        if: ${{ matrix.platform == 'ios' && !contains(fromJSON('["disable","cleanup","promote"]'), inputs.action) }}
        run: |
          echo "export NODE_BINARY=$(which node)" > app/ios/.xcode.env.local
          cd app && USE_HERMES=1 yarn run ios:setup

      # The fingerprint the bundle must match. production/preview: the one the
      # target store build recorded in its tag, and its source list when the
      # staging artifact is still there (to name a difference). device-test: the
      # test app's, given as expect_fingerprint. None found: the run stops.
      - name: Expected fingerprint
        id: expected
        if: ${{ !contains(fromJSON('["disable","cleanup","promote"]'), inputs.action) }}
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE: ${{ inputs.release }}
          PLATFORM: ${{ matrix.platform }}
          EXPECT_FINGERPRINT: ${{ inputs.expect_fingerprint }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The store build is the release number before its dot: 276.2 targets build 276.
          BUILD="${RELEASE%%.*}"
          if [ "$CHANNEL" = device-test ]; then
            echo "hash=$EXPECT_FINGERPRINT" >> "$GITHUB_OUTPUT"
            echo "expected $PLATFORM fingerprint $EXPECT_FINGERPRINT (the test app's)"
            exit 0
          fi
          hash=$(node scripts/ota/check-fingerprint.mjs recorded --build "$BUILD" --platform "$PLATFORM")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "expected $PLATFORM fingerprint $hash (recorded by build $BUILD)"
          tag=$(git tag --list "staging-v*-$BUILD")
          sha=$(git rev-list -n 1 "$tag")
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow staging.yaml --commit "$sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          dir="$RUNNER_TEMP/recorded-$PLATFORM"
          if [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n "ota-fingerprint-$PLATFORM" -D "$dir" 2>/dev/null; then
            echo "recorded=$dir/fingerprint.json" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::build $BUILD's source list is not available (run ${run:-unknown}); a mismatch will be reported by hash only"
          fi

      # production and preview: the store key, which must be OTA_PUBLIC_KEY's pair.
      # device-test: ONLY the test key, which must not be (no fallback). A dry
      # run checks the mapping with the real secrets and writes nothing.
      - name: Signing key
        if: ${{ inputs.dry_run || !contains(fromJSON('["disable","cleanup","promote"]'), inputs.action) }}
        env:
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY_PEM }}
          OTA_TEST_SIGNING_KEY_PEM: ${{ secrets.OTA_TEST_SIGNING_KEY_PEM }}
          OTA_PUBLIC_KEY: ${{ vars.OTA_PUBLIC_KEY }}
          CHANNEL: ${{ inputs.channel }}
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          umask 077
          flags=()
          [ "$ACTION" = tamper ] && flags+=(--tamper)
          [ "$DRY_RUN" = true ] && flags+=(--check)
          node scripts/ota/signing-key.mjs --channel "$CHANNEL" --out "$RUNNER_TEMP" "${flags[@]}"

      # The same native settings the store build wrote (staging.yaml), from the
      # same repository variables: the CLI refuses to publish a signed bundle
      # unless the checkout carries the public key and a fingerprint.json, and
      # the fingerprint must come out as the build's did.
      - name: The checkout is clean before the native settings are written
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "::error::the checkout is not clean before the native OTA settings"
            exit 1
          fi

      - name: Native OTA settings
        if: ${{ !inputs.dry_run && inputs.channel != 'device-test' && inputs.action == 'publish' }}
        env:
          OTA_PUBLIC_KEY: ${{ vars.OTA_PUBLIC_KEY }}
          OTA_CHANNEL: ${{ inputs.channel }}
        run: node scripts/ota/native-config.mjs

      - name: Publish to ring 0
        if: ${{ !inputs.dry_run && inputs.channel != 'device-test' && inputs.action == 'publish' }}
        working-directory: app
        env:
          OTA_SIGNING_KEY: ${{ runner.temp }}/ota-private-key.pem
          OTA_SERVER_URL: ${{ vars.OTA_SERVER_URL }}
          HOT_UPDATER_AUTH_TOKEN: ${{ secrets.HOT_UPDATER_AUTH_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE: ${{ inputs.release }}
          PLATFORM: ${{ matrix.platform }}
          SCOPE: ${{ inputs.scope }}
          EXPECTED: ${{ steps.expected.outputs.hash }}
          RECORDED: ${{ steps.expected.outputs.recorded }}
          # Each bundle put on ring 0, as a JSON line, for the next step to upload (post-release.yml reads it).
          OTA_BUNDLE_RECORD: ${{ runner.temp }}/ota-bundle.jsonl
        run: |
          # The store build is the release number before its dot: 276.2 targets build 276.
          BUILD="${RELEASE%%.*}"
          recorded=()
          [ -n "$RECORDED" ] && recorded=(--recorded-fingerprint "$RECORDED")
          node scripts/ota-deploy.mjs --build "$BUILD" --release "$RELEASE" --channel "$CHANNEL" --platform "$PLATFORM" --scope "$SCOPE" \
            --after-native-config --expect-fingerprint "$PLATFORM=$EXPECTED" "${recorded[@]}"

      # The bundle ids, structured, for post-release.yml and its brake: they no longer depend on reading this job's
      # log, or on the wording of its lines. post-release reads the log only for a platform with no record here.
      # Never fatal: the bundle is already on ring 0 by now, and post-release (the smoke and the brake) runs only on a
      # successful publish run, so failing this run over a missing record would skip the whole safety net, silently.
      - name: Record the published bundle
        if: ${{ success() && !inputs.dry_run && inputs.channel != 'device-test' && inputs.action == 'publish' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ota-bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/ota-bundle.jsonl
          if-no-files-found: warn

      # A publish to ring1 or ring2 (the default: the owner's rule, 10-29, is that updates reach testers at once) widens
      # this platform's bundle in the same run, right after it reached ring 0, on the run's one approval. The bundle id
      # is the record ota-deploy just wrote. If the widen fails, the bundle stays on ring 0 and the run fails, naming
      # it; post-release.yml still smokes it (it runs after a failed run too, and reads what the run published).
      - name: Widen the published bundle
        if: ${{ success() && !inputs.dry_run && inputs.channel != 'device-test' && inputs.action == 'publish' && inputs.to_ring != 'ring0' }}
        env:
          OTA_SERVER_URL: ${{ vars.OTA_SERVER_URL }}
          HOT_UPDATER_AUTH_TOKEN: ${{ secrets.HOT_UPDATER_AUTH_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ matrix.platform }}
          TO_RING: ${{ inputs.to_ring }}
          RECORD: ${{ runner.temp }}/ota-bundle.jsonl
          SOAK_HOURS: ${{ vars.OTA_PROMOTE_SOAK_HOURS }}
        run: |
          id=$(node -e 'const [f, p] = process.argv.slice(1); const rows = require("fs").readFileSync(f, "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l)).filter((r) => r.platform === p); if (rows.length !== 1) process.exit(1); console.log(rows[0].id)' "$RECORD" "$PLATFORM") \
            || { echo "::error::$PLATFORM was published to ring 0 but not widened: its bundle record is missing or ambiguous"; exit 1; }
          echo "widening $PLATFORM bundle $id to $TO_RING"
          node scripts/ota/promote.mjs --channel "$CHANNEL" --platform "$PLATFORM" --bundle-id "$id" --to "$TO_RING" --soak-hours "$SOAK_HOURS"

      # production/preview: widen one bundle past ring 0. A dry run only checks.
      - name: Promote (${{ inputs.channel }})
        if: ${{ inputs.channel != 'device-test' && inputs.action == 'promote' }}
        env:
          OTA_SERVER_URL: ${{ vars.OTA_SERVER_URL }}
          HOT_UPDATER_AUTH_TOKEN: ${{ secrets.HOT_UPDATER_AUTH_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ matrix.platform }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          TO_RING: ${{ inputs.to_ring }}
          # Hours a bundle must have been published before it is promoted. A repository
          # variable, as the dispatch has no room for an eleventh input: 0 while the
          # audience is beta testers is set there on purpose. Passed raw, so '0' arrives
          # as '0'; unset arrives empty, and promote.mjs reads that as 24.
          SOAK_HOURS: ${{ vars.OTA_PROMOTE_SOAK_HOURS }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          check=()
          [ "$DRY_RUN" = true ] && check=(--check)
          if [ "$PLATFORM" = both ]; then
            target=(--bundles "$BUNDLE_ID")
          else
            target=(--platform "$PLATFORM" --bundle-id "$BUNDLE_ID")
          fi
          node scripts/ota/promote.mjs --channel "$CHANNEL" "${target[@]}" --to "$TO_RING" --soak-hours "$SOAK_HOURS" "${check[@]}"

      # production/preview: withdraw one bundle. A dry run checks it is there.
      - name: Withdraw (${{ inputs.channel }})
        if: ${{ inputs.channel != 'device-test' && inputs.action == 'disable' }}
        env:
          OTA_SERVER_URL: ${{ vars.OTA_SERVER_URL }}
          HOT_UPDATER_AUTH_TOKEN: ${{ secrets.HOT_UPDATER_AUTH_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ matrix.platform }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          check=()
          [ "$DRY_RUN" = true ] && check=(--check)
          node scripts/ota/withdraw.mjs --channel "$CHANNEL" --platform "$PLATFORM" --bundle-id "$BUNDLE_ID" "${check[@]}"

      # The trial's moves on the test app's channel. Each publish is a local,
      # never-pushed commit on top of the verified one (scripts/ota/device-test.sh).
      - name: Device test (${{ inputs.action }})
        if: ${{ !inputs.dry_run && inputs.channel == 'device-test' }}
        env:
          OTA_SIGNING_KEY: ${{ runner.temp }}/ota-private-key.pem
          OTA_PUBLIC_KEY_FILE: ${{ runner.temp }}/ota-public-key.pem
          OTA_SERVER_URL: ${{ vars.OTA_SERVER_URL }}
          HOT_UPDATER_AUTH_TOKEN: ${{ secrets.HOT_UPDATER_AUTH_TOKEN }}
          OTA_BASE: ${{ inputs.base }}
          PLATFORM: ${{ matrix.platform }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          EXPECT_FINGERPRINT: ${{ inputs.expect_fingerprint }}
          ACTION: ${{ inputs.action }}
        run: bash scripts/ota/device-test.sh "$ACTION"

      # A dry run checks the fingerprint too: what this run would build, against
      # the expected one. A mismatch, or a target build that recorded none, fails.
      - name: Fingerprint check (dry run)
        if: ${{ inputs.dry_run && !contains(fromJSON('["disable","cleanup","promote"]'), inputs.action) }}
        env:
          OTA_PUBLIC_KEY: ${{ vars.OTA_PUBLIC_KEY }}
          OTA_CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ matrix.platform }}
          EXPECTED: ${{ steps.expected.outputs.hash }}
          RECORDED: ${{ steps.expected.outputs.recorded }}
        run: |
          node scripts/ota/native-config.mjs
          node scripts/ota/check-fingerprint.mjs verify --platform "$PLATFORM" --expected "$EXPECTED" --recorded "${RECORDED:-none}"

      # The tier, as the publish will read it. The dry run passes on exit 0 or 5 (ota-strict, a label since 10-29).
      - name: Dry run
        if: ${{ inputs.dry_run && inputs.channel != 'device-test' && inputs.action == 'publish' }}
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          # The store build is the release number before its dot: 276.2 targets build 276.
          BUILD="${RELEASE%%.*}"
          tag=$(git tag --list "staging-v*-$BUILD")
          if [ "$(printf '%s\n' "$tag" | grep -c .)" != 1 ]; then
            echo "::error::expected one staging-v*-$BUILD tag, found: ${tag:-none}"
            exit 1
          fi
          code=0
          node scripts/release/tier.mjs --range "$tag..$GITHUB_SHA" --json || code=$?
          case "$code" in
            0) ;;
            # ota-strict: a label since 10-29 (sign-in / keys / the VTI protocol line), published like ota.
            5) echo "tier ota-strict: published like ota; the release touches what its strict flags name" ;;
            *) echo "::error::tier.mjs exit $code: not publishable over the air"; exit 1 ;;
          esac

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/ota-private-key.pem" "$RUNNER_TEMP/ota-public-key.pem"
