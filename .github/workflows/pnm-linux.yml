name: pnm for CI runners

# Builds the pnm CLI for Linux runners at the exact VTI commit the Farm runs, so the gate's legs can run on
# GitHub-hosted runners (moving the gate off the Mac). On a runner pnm cannot use a Keychain: it is built with
# upstream's file session store (config-session, sessions under PNM_HOME) instead of the OS keyring. Upstream
# marks that store dev / non-sensitive only, so the only identities it may ever hold are CI-only ones with the
# narrowest rights (granting and deleting test-phone keys on the Farm runner VTAs), never a person's.
# The binary is cached by commit and features, so a build happens once per pin.
#
#   gh workflow run pnm-linux.yml -R berkmancenter/keyring-wallet -f vti-ref=<commit>
#   jobs: uses: ./.github/workflows/pnm-linux.yml   (then download the artifact named in outputs.artifact)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pnm-linux.yml
  workflow_dispatch:
    inputs:
      vti-ref:
        description: "verifiable-trust-infrastructure commit (default: the Farm's vta-service v0.56.0)"
        type: string
        default: ""
  workflow_call:
    inputs:
      vti-ref:
        type: string
        default: ""
    outputs:
      artifact:
        description: The artifact holding the pnm binary
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

env:
  # The Farm's VTA: vta-service v0.56.0 (FARM_VERSIONS in the gate's farm.env, checked 2026-10-11). Move this with
  # the Farm, never ahead of it.
  FARM_VTI_REF: 39c801ed091cdd0aaa8247b8c7aa8e564903d4d6
  # The release FARM_VTI_REF is: the commit must be this tag's (checked below). The gate compares this version with the
  # Farm's recorded one on every run (e2e/gate/farm-drift.mjs, farm-drift= in the run's meta).
  FARM_VTI_VERSION: "0.56.0"
  RUST_VERSION: "1.95.0"
  FEATURES: config-session,tsp
  # Upstream's explicit switch to the file session store, first in its priority order: a job that runs pnm sets it
  # too, so no keyring backend is ever tried on a runner.
  VTI_SECURE_STORE: file

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - name: Which commit
        id: name
        shell: bash
        # The input travels as an env value, never interpolated into the script; only a full commit sha is accepted,
        # so a mutable branch name can never be built and cached as if it were fixed.
        env:
          REF: ${{ inputs.vti-ref }}
        run: |
          ref="${REF:-$FARM_VTI_REF}"
          [[ $ref =~ ^[0-9a-f]{40}$ ]] || { echo "::error::vti-ref must be a full 40-character commit sha, not \"$ref\""; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "artifact=pnm-linux-x86_64-${ref:0:12}" >> "$GITHUB_OUTPUT"
          echo "features=${FEATURES//,/+}" >> "$GITHUB_OUTPUT"

      # The pin is a release, never a stray commit: vta-service-v<FARM_VTI_VERSION> must point at FARM_VTI_REF.
      - name: The pin is the release tag's commit
        if: steps.name.outputs.ref == env.FARM_VTI_REF
        shell: bash
        run: |
          tag="vta-service-v$FARM_VTI_VERSION"
          # An annotated tag lists its tag object and, as "^{}", the commit it points at: the commit is what is pinned.
          refs=$(git ls-remote https://github.com/OpenVTC/verifiable-trust-infrastructure "refs/tags/$tag^{}" "refs/tags/$tag")
          sha=$(echo "$refs" | awk '$2 ~ /\^\{\}$/ {print $1}' | head -1)
          [ -n "$sha" ] || sha=$(echo "$refs" | awk '{print $1}' | head -1)
          [ -n "$sha" ] || { echo "::error::no tag $tag upstream"; exit 1; }
          [ "$sha" = "$FARM_VTI_REF" ] || { echo "::error::$tag is $sha, but FARM_VTI_REF is $FARM_VTI_REF: move both together"; exit 1; }
          echo "$tag = $FARM_VTI_REF"

      - name: Cached binary
        id: cache
        uses: actions/cache@v4
        with:
          path: out/pnm
          # A cache key may not contain commas: the features list is joined with "+".
          key: pnm-linux-x86_64-${{ steps.name.outputs.ref }}-${{ steps.name.outputs.features }}-rust${{ env.RUST_VERSION }}

      - name: Check out VTI at that commit
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: OpenVTC/verifiable-trust-infrastructure
          ref: ${{ steps.name.outputs.ref }}
          path: vti
          persist-credentials: false

      - name: Build pnm (file session store, no keyring)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: vti
        run: |
          # A dependency links libdbus even without the keyring feature (libdbus-sys's build script needs it).
          sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo +"$RUST_VERSION" build --locked --release -p pnm-cli --no-default-features --features "$FEATURES"
          mkdir -p ../out && cp target/release/pnm ../out/pnm

      # Session handling is tested where an identity exists (the gate's CI jobs); this only proves the binary runs.
      - name: The binary runs
        shell: bash
        run: |
          home=$(mktemp -d)
          # pnm has no --version flag: the commit and sha below identify the build.
          # To a file, not a pipe: with pipefail, head closing early would fail pnm on SIGPIPE.
          PNM_HOME="$home" ./out/pnm --help > "$home/help.txt"
          head -20 "$home/help.txt"
          grep -q '^Usage: pnm' "$home/help.txt"
          echo "sha256 $(sha256sum out/pnm | cut -c1-64)  ref ${{ steps.name.outputs.ref }}  features $FEATURES" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: out/pnm
          retention-days: 30
