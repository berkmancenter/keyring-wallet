name: Framework full suite

# Every jest suite of the framework (packages/*) with coverage, in five parts: core in
# four shards and every other package in the fifth. Ported from the former
# keyring-bifold repository's full-tests.yaml at the fold (docs/plans/
# single-codebase-plan.md, Phase 3); since Phase 2 the packages are workspaces of the
# one install at the repository root. Runs on every push to main that touches
# packages/, nightly, and on dispatch; a pull request runs the selected subset in
# framework.yml instead. The upload to codecov is not ported: neither repository
# holds a CODECOV_TOKEN, so that step never reported anything.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/framework-full.yml"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-22.04
    name: Framework jest part (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [core 1/4, core 2/4, core 3/4, core 4/4, other packages]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          # The one install of the repository (app and packages/* are its workspaces, one yarn.lock at the root).
          path: |
            node_modules
            app/node_modules
            packages/*/node_modules
            .yarn/cache
            .yarn/install-state.gz
          key: framework-deps-v2-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', '.yarn/patches/**', 'package.json', 'app/package.json', 'packages/*/package.json', '.github/workflows/actions/setup-node/action.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build the Node-consumed packages
        run: yarn build:packages

      - name: Date jest's cache
        id: jest-cache
        if: startsWith(matrix.part, 'core ')
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore jest's cache
        if: startsWith(matrix.part, 'core ')
        uses: actions/cache@v4
        with:
          path: packages/core/.jest/cache
          key: framework-jest-cov-v2-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/core/babel.config.js', 'packages/core/jest.config.js') }}-${{ matrix.part }}-${{ steps.jest-cache.outputs.day }}
          restore-keys: |
            framework-jest-cov-v2-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/core/babel.config.js', 'packages/core/jest.config.js') }}-${{ matrix.part }}-

      - name: Automated testing with coverage
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            core\ *) yarn workspace @bifold/core run coverage --ci --shard="${PART#core }" ;;
            # The root (keyring-wallet) and the app are workspaces of the same install, not the framework's suites.
            *) yarn workspaces foreach --all --topological-dev --exclude keyring-wallet --exclude keyring-wallet-mobile-app --exclude @bifold/core run coverage --ci ;;
          esac

  full:
    name: Framework full suite
    needs: shard
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "shards: $RESULT"
          test "$RESULT" = success
