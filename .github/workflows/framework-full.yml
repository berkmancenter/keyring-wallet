name: Framework full suite

# Every jest suite of the framework (bifold/) with coverage, in five parts: core in
# four shards and every other package in the fifth. Ported from the former
# keyring-bifold repository's full-tests.yaml at the fold (docs/plans/
# single-codebase-plan.md, Phase 3). Runs on every push to main that touches
# bifold/, nightly, and on dispatch; a pull request runs the selected subset in
# framework.yml instead. The upload to codecov is not ported: neither repository
# holds a CODECOV_TOKEN, so that step never reported anything.

on:
  push:
    # fold/2-framework-ci: TEMPORARY, so the full suite runs once on its own branch as the proof (a dispatch needs
    # the workflow on the default branch); removed before the PR merges.
    branches: [main, fold/2-framework-ci]
    paths:
      - "bifold/**"
      - ".github/workflows/framework-full.yml"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: bifold

jobs:
  shard:
    runs-on: ubuntu-22.04
    name: Framework jest part (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [core 1/4, core 2/4, core 3/4, core 4/4, other packages]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            bifold/node_modules
            bifold/packages/*/node_modules
            bifold/samples/*/node_modules
            bifold/.yarn/cache
            bifold/.yarn/install-state.gz
          key: framework-deps-v1-${{ runner.os }}-${{ hashFiles('bifold/yarn.lock', 'bifold/.yarnrc.yml', 'bifold/.yarn/patches/**', 'bifold/package.json', 'bifold/packages/*/package.json', 'bifold/samples/*/package.json', '.github/workflows/actions/setup-node/action.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Workspace
        run: yarn build

      - name: Date jest's cache
        id: jest-cache
        if: startsWith(matrix.part, 'core ')
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore jest's cache
        if: startsWith(matrix.part, 'core ')
        uses: actions/cache@v4
        with:
          path: bifold/packages/core/.jest/cache
          key: framework-jest-cov-v1-${{ runner.os }}-${{ hashFiles('bifold/yarn.lock', 'bifold/packages/core/babel.config.js', 'bifold/packages/core/jest.config.js') }}-${{ matrix.part }}-${{ steps.jest-cache.outputs.day }}
          restore-keys: |
            framework-jest-cov-v1-${{ runner.os }}-${{ hashFiles('bifold/yarn.lock', 'bifold/packages/core/babel.config.js', 'bifold/packages/core/jest.config.js') }}-${{ matrix.part }}-

      - name: Automated testing with coverage
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            core\ *) yarn workspace @bifold/core run coverage --ci --shard="${PART#core }" ;;
            *) yarn workspaces foreach --all --topological-dev --exclude keyring-bifold --exclude @bifold/core run coverage --ci ;;
          esac

  full:
    name: Framework full suite
    needs: shard
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Every shard passed
        working-directory: .
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "shards: $RESULT"
          test "$RESULT" = success
