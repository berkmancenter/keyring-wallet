name: Code Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, edited]

jobs:
  workflows:
    runs-on: ubuntu-22.04
    name: Workflow files
    steps:
      - uses: actions/checkout@v4

      # No other check reads .github/workflows. #108 deleted a job that others
      # still needed; GitHub rejected the file only once it was on main.
      # Top-level files only: actions/ holds composite actions, not workflows.
      # shellcheck is off until the existing run: blocks have been cleaned up.
      - name: Lint workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck= .github/workflows/*.yml .github/workflows/*.yaml

      # This repo is public. Private notes (*.local-al*) and files marked
      # *.private.* must never be committed (one was, 2026-09-15 to 09-25).
      - name: No private files in the tree
        run: |
          found=$(git ls-files | grep -E '\.local-al|\.private\.' || true)
          if [ -n "$found" ]; then
            echo "::error::Private files are committed:"; echo "$found"; exit 1
          fi

      # The e2e clock switch shortens the app's clocks for the release checks.
      # Only test-builds.yml may write it into an app's .env; staging builds what
      # ships, and refuses a .env that carries it, in both its app jobs.
      - name: Only test builds set E2E_CLOCKS
        run: |
          found=$(grep -l 'E2E_CLOCKS[=]' .github/workflows/*.yml .github/workflows/*.yaml app/.env.sample \
            | grep -vx '.github/workflows/test-builds.yml' || true)
          if [ -n "$found" ]; then
            echo "::error::Only test-builds.yml may set E2E_CLOCKS:"; echo "$found"; exit 1
          fi
          guards=$(grep -c 'E2E_CLOCKS would be baked into a store build' .github/workflows/staging.yaml || true)
          if [ "$guards" -lt 2 ]; then
            echo "::error::staging.yaml must refuse E2E_CLOCKS in both the Android and the iOS build (found $guards guards)"; exit 1
          fi

  lint:
    runs-on: ubuntu-22.04
    name: Lint+Format+Types
    steps:
      - name: Checkout KeyRing
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Cache app node_modules
        uses: actions/cache@v3
        with:
          path: .yarn/cache
          # Cache will be invalidated if yarn.lock changes
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        working-directory: app
        run: yarn install --immutable

      - name: Check style
        working-directory: app
        run: |
          yarn prettier
          echo "Run 'yarn prettier:fix to automatically fix formatting issues."

      - name: LINTing
        working-directory: app
        run: yarn lint

      - name: Check types
        working-directory: app
        run: yarn typecheck

      # e2e/ is a standalone npm package, deliberately outside the yarn
      # workspaces, so none of the steps above touch it. A syntax error there
      # reaches main through a fully green CI run and breaks every suite at
      # import time -- which is exactly what happened in #33. This is the
      # cheapest gate that would have caught it; it needs no install, since
      # node --check parses without resolving imports.
      - name: Parse-check the e2e harness
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            # --input-type=module, NOT a plain `node --check <file>`: e2e/ is
            # "type": "module" and `node --check` parses a path as CommonJS,
            # where a stray JSDoc body after a `}` is legal-looking enough to
            # pass. Verified against the #33 defect: `node --check` exits 0 on
            # it, this exits 1.
            node --input-type=module --check < "$f" \
              || { echo "::error file=$f::$f is not valid ES module JavaScript"; fail=1; }
          done < <(find e2e -name '*.js' -not -path 'e2e/node_modules/*' -not -path 'e2e/artifacts/*')
          # Every testID the drivers name must exist in the app (e2e/lib/testids*.json,
          # see e2e/scripts/sync-testids.sh): a renamed id fails here, not at the gate.
          node e2e/scripts/check-testids.mjs || fail=1
          # The leg cleanup (lib.sh keys_since) finds and deletes this leg's phone keys through the CI guard, and says
          # so loudly when the runner's ACL cannot be read (a fake VTA; no secrets, no network).
          bash e2e/gate/ci/keys-since.test.sh || { echo "::error file=e2e/gate/ci/keys-since.test.sh::the leg cleanup test failed"; fail=1; }
          # The CI lane's configuration must name one runner, linkfail's approver DID and no admin credential (item 11).
          bash e2e/gate/ci/ci-env-check.test.sh || { echo "::error file=e2e/gate/ci/ci-env-check.test.sh::the CI configuration check test failed"; fail=1; }
          exit $fail

  test:
    runs-on: ubuntu-22.04
    name: Testing
    steps:
      - name: Checkout KeyRing
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup NodeJS
        uses: ./.github/workflows/actions/setup-node

      - name: Cache app node_modules
        uses: actions/cache@v3
        with:
          path: .yarn/cache
          # Cache will be invalidated if yarn.lock changes
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        working-directory: app
        run: yarn install --immutable

      - name: Automated testing
        run: yarn test