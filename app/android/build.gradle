// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        androidXBrowser = "1.5.0"
        javaVersion = JavaVersion.VERSION_17
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP version comes from @react-native/gradle-plugin (RN 0.81 -> AGP 8.12)
        classpath("com.android.tools.build:gradle")
        classpath('com.google.gms:google-services:4.4.2')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }

        google()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
    configurations.all {
       it.resolutionStrategy.activateDependencyLocking()
    }

    // Align every Android subproject on Java 17 (expo-modules-core otherwise
    // compiles Java at 1.8 while Kotlin targets 17 and the build fails).
    // Same approach as bifold samples/app.
    afterEvaluate { project ->
        ["com.android.application", "com.android.library"].each { pluginId ->
            project.plugins.withId(pluginId) {
                project.android {
                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                }
            }
        }
    }
}

dependencyLocking {
    lockAllConfigurations()
}