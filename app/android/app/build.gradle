apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"


/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["/Users/albertoleon/.nvm/versions/node/v20.19.2/bin/node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// Fix for react-native-vector-icons task dependency issue
afterEvaluate {
    def copyFontsTask = tasks.findByName('copyReactNativeVectorIconFonts')
    def lintTask = tasks.findByName('generateReleaseLintVitalReportModel')
    
    if (copyFontsTask != null && lintTask != null) {
        lintTask.dependsOn copyFontsTask
    }
    
    // Also fix other potential lint tasks that might have the same issue
    tasks.withType(com.android.build.gradle.internal.lint.LintModelWriterTask) { task ->
        if (copyFontsTask != null) {
            task.dependsOn copyFontsTask
        }
    }
}


/**
 * Run Proguard to shrink the Java bytecode in release builds.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore.
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US.  Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'


/**
 * Architectures to build native code for in debug.
 */
def nativeArchitectures = project.getProperties().get("reactNativeDebugArchitectures")

android {
    namespace 'asml.bkc.harvard.wallet'
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    externalNativeBuild {
        cmake {
            version "3.22.1"
        }
    }
    // Java/Kotlin toolchain + jvmTarget are managed by the RN 0.81 gradle
    // plugin; setting them here now fails ("languageVersion is final")

    defaultConfig {
        applicationId "asml.bkc.harvard.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode System.getenv("VERSION_CODE") ? System.getenv("VERSION_CODE").toInteger() : 4
        versionName System.getenv("VERSION_NAME") ? System.getenv("VERSION_NAME").toString() : "0.1.0"

        missingDimensionStrategy 'react-native-camera', 'general'
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (System.getenv("PLAY_STORE_JKS_PASSWD")) {
                // Production signing (CI/CD)
                storeFile = file("release.keystore")
                storePassword System.getenv("PLAY_STORE_JKS_PASSWD")
                keyAlias System.getenv("PLAY_STORE_JKS_ALIAS")
                keyPassword System.getenv("PLAY_STORE_JKS_PASSWD")
            } else {
                // Local development signing
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            if (nativeArchitectures) {
                ndk {
                    abiFilters nativeArchitectures.split(',')
                }
            }
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        jniLibs {
            // RN 0.76+ prefab: JSI libraries (@hyperledger/*) copy the imported
            // libreactnative.so etc. into their own AARs, colliding with the copies
            // from the react-android AAR. The contents are identical — keep one.
            pickFirsts += ['**/libreactnative.so', '**/libjsi.so', '**/libfbjni.so', '**/libc++_shared.so']
        }
    }
}

// Fix the task dependency issue between lint and React Native Vector Icons
afterEvaluate {
    def lintTask = tasks.findByName('generateReleaseLintVitalReportModel')
    def copyFontsTask = tasks.findByName('copyReactNativeVectorIconFonts')
    
    if (lintTask && copyFontsTask) {
        lintTask.dependsOn(copyFontsTask)
        println "Fixed dependency: generateReleaseLintVitalReportModel depends on copyReactNativeVectorIconFonts"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")

    implementation 'net.java.dev.jna:jna:5.14.0'
    
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    implementation platform('com.google.firebase:firebase-bom:26.8.0')
    
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

