# card-verify for DTG Credentials v1: the VTI SDK at the 0.47 pin
# (PINS.json "verifiable-trust-infrastructure-v047") judges what Keyring writes
# in the new shape — a vetted/1 statement — as an openvtc applicant on 0.47
# runs it (vta-sdk verify_statement + check_against_card + check_against_session).
# A sibling of ../card-verify, which stays on the main pin; see README.md.
[package]
name = "card-verify-v047"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The second, separately cloned VTI pin (setup-external puts it in its own directory).
vta-sdk = { path = "../../../external/verifiable-trust-infrastructure-v047/vta-sdk", features = ["vetting"] }
# The versions VTI's Cargo.lock pins at 439a0333.
affinidi-did-resolver-cache-sdk = { version = "=0.8.38", features = ["network"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Standalone: not a member of any workspace.
[workspace]
