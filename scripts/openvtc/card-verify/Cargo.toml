# Verify a Keyring Vetting Card with the VTI SDK's own verifier — the check an
# openvtc vetter runs (vta-sdk `vetting::card::verify_card`). See README.md.
[package]
name = "card-verify"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned clone (scripts/openvtc/PINS.json, verifiable-trust-infrastructure).
vta-sdk = { path = "../../../external/verifiable-trust-infrastructure/vta-sdk", features = ["vetting"] }
affinidi-did-resolver-cache-sdk = { version = "0.8.37", features = ["network"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
# The digest function vta-sdk's vetting::digest calls; the version VTI's Cargo.lock pins.
dtg-credentials = "=0.9.1"
chrono = { version = "0.4", features = ["serde"] }

# Standalone: not a member of any workspace.
[workspace]
