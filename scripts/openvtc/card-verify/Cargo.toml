# Verify a Keyring Vetting Card with the VTI SDK's own verifier — the check an
# openvtc vetter runs (vta-sdk `vetting::card::verify_card`). See README.md.
[package]
name = "card-verify"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned clone (scripts/openvtc/PINS.json, verifiable-trust-infrastructure).
vta-sdk = { path = "../../../external/verifiable-trust-infrastructure/vta-sdk", features = ["vetting"] }
# The resolver vta-sdk uses; the version VTI's Cargo.lock pins (two would split affinidi-crypto).
affinidi-did-resolver-cache-sdk = { version = "=0.9.0", features = ["network"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
# The digest function vta-sdk's vetting::digest calls; the version VTI's Cargo.lock pins.
dtg-credentials = "=0.16.0"
# The Secret type vta-sdk's signers take; the version VTI's Cargo.lock pins.
affinidi-secrets-resolver = "=0.6.0"
# The TrustTask type vta-sdk's proof verifier takes, and the typed payloads and
# published schemas verify-task checks (`validate`, as VTI's workspace enables it);
# the version VTI's Cargo.lock pins.
# From 0.39 each spec family is its own feature (still so at 0.41); these are the ones `typed_payload_check` (src/main.rs) names.
trust-tasks-rs = { version = "=0.41.2", features = [
  "validate",
  "acl",
  "auth",
  "config",
  "credential-exchange",
  "keys",
  "task-consent",
  "vetting",
  "vta",
  "vtc",
] }
chrono = { version = "0.4", features = ["serde"] }
# Signs the role credential in sign-eligibility; the version VTI's Cargo.lock pins.
affinidi-data-integrity = "=0.9.2"

# Standalone: not a member of any workspace.
[workspace]
