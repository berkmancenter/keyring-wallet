  <text font-family="system-ui, sans-serif" font-size="13" fill="#8A8A8A"><tspan x="404" y="56">Shown after the right number</tspan><tspan x="404" dy="18">was typed. &quot;Approve&quot; asks</tspan><tspan x="404" dy="18">for the phone’s face or</tspan><tspan x="404" dy="18">fingerprint check (§3.2 step</tspan><tspan x="404" dy="18">6).</tspan><tspan x="404" dy="18"> </tspan><tspan x="404" dy="18">With no memory picked the</tspan><tspan x="404" dy="18">second line reads &quot;It will</tspan><tspan x="404" dy="18">have no memory.&quot; The date</tspan><tspan x="404" dy="18">and the memories are</tspan><tspan x="404" dy="18">samples.</tspan><tspan x="404" dy="18"> </tspan></text>
