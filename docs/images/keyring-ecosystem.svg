<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How Keyring fits the OpenVTC ecosystem</title>
  <desc>Keyring on the phone talks to a mediator over TSP or DIDComm v2. The mediator relays to your agent (VTA), which speaks Trust Tasks with communities (VTC and rooms). Keyring talks to a contact's Keyring over DIDComm via mediators, and to a witness with Trust Tasks.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b3f8f"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#5b3f8f;stroke-width:2}
      .phone{fill:#f3eef9;stroke:#5b3f8f;stroke-width:2;stroke-dasharray:6 4}
      .t{fill:#1d1a26;font-size:16px;font-weight:600}
      .s{fill:#5d5869;font-size:13px}
      .l{fill:#5b3f8f;font-size:13px;font-weight:600;paint-order:stroke;stroke:#fbfaf7;stroke-width:5px;stroke-linejoin:round}
      .e{stroke:#5b3f8f;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect x="0" y="0" width="880" height="400" rx="16" fill="#fbfaf7"/>

  <!-- Phone -->
  <rect class="phone" x="30" y="150" width="190" height="100" rx="14"/>
  <text class="s" x="45" y="172">Your phone</text>
  <rect class="box" x="55" y="182" width="140" height="52" rx="10"/>
  <text class="t" x="125" y="214" text-anchor="middle">Keyring</text>

  <!-- Mediator -->
  <rect class="box" x="345" y="60" width="160" height="60" rx="30"/>
  <text class="t" x="425" y="88" text-anchor="middle">Mediator</text>
  <text class="s" x="425" y="107" text-anchor="middle">holds messages for you</text>

  <!-- VTA -->
  <rect class="box" x="640" y="40" width="200" height="60" rx="10"/>
  <text class="t" x="740" y="67" text-anchor="middle">Your agent (VTA)</text>
  <text class="s" x="740" y="86" text-anchor="middle">acts for you</text>

  <!-- VTC -->
  <rect class="box" x="640" y="160" width="200" height="60" rx="10"/>
  <text class="t" x="740" y="187" text-anchor="middle">Community (VTC)</text>
  <text class="s" x="740" y="206" text-anchor="middle">and its rooms</text>

  <!-- Contact -->
  <rect class="box" x="345" y="300" width="180" height="60" rx="10"/>
  <text class="t" x="435" y="327" text-anchor="middle">A contact's Keyring</text>
  <text class="s" x="435" y="346" text-anchor="middle">people you know</text>

  <!-- Witness -->
  <rect class="box" x="640" y="300" width="200" height="60" rx="10"/>
  <text class="t" x="740" y="327" text-anchor="middle">Witness</text>
  <text class="s" x="740" y="346" text-anchor="middle">confirms an exchange</text>

  <!-- Edges -->
  <path class="e" d="M195,195 C270,150 290,95 343,92" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="228" y="120">TSP or DIDComm v2</text>

  <path class="e" d="M507,86 L638,72" marker-start="url(#a)" marker-end="url(#a)"/>

  <path class="e" d="M740,102 L740,158" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="750" y="135">Trust Tasks</text>

  <path class="e" d="M150,236 C170,300 260,330 343,330" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="160" y="320">DIDComm, via mediators</text>

  <path class="e" d="M197,222 C380,250 560,280 650,298" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="420" y="262">Trust Tasks</text>
</svg>
